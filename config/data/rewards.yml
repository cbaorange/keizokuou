contents:
  - id: 1
    required_rate: 100
    category: habit
    title: 逆効果？ポモドーロタイマーの間違った使い方
    body: |
      　ポモドーロタイマーといえば「25分作業して5分休む」が有名です。しかし、取り組む内容によっては、作業⇄休憩 のサイクルが短すぎることで、逆に集中できなくなる恐れもあります。大切なのは、この時間をきっちり守ることではありません。本来の目的は、集中しやすい環境を作り、作業の効率を上げることです。

      　例えば、好きなことや得意な作業では、集中しているうちに時間を忘れる「フロー状態」に入ることがあります。心理学者ミハイ・チクセントミハイが研究したこの状態では、作業に深く集中できます。そこでタイマーが鳴るたびに休憩すると、せっかくの集中（フロー状態）を自分から切ってしまうことになります。

      　この対策として、好き・得意な作業は長め、苦手な作業は短めにするなど、自分に合わせて時間を変えてみましょう。25分はルールではなく、集中するための目安として使うのがおすすめです。


  - id: 2
    required_rate: 100
    category: battle
    title: 【バトル】タイプ相性
    body: |
      シュカモンには、それぞれ曜日に対応したタイプがある。

      タイプ相性はシンプル。次の曜日のタイプに弱い。

      日 ← 月 ← 火 ← 水 ← 木 ← 金 ← 土 ← 日
      （ 不利 ← 有利 ）

      例えば、火タイプのアテナは、水タイプの すいぼにゃんにゃん が弱点。

      弱点を突かれると、そのターンは攻撃できない。

      タイプ相性の覚え方は、
      「明日は今日より強くなる！」


  - id: 3
    required_rate: 400
    category: habit
    title: 最初から長時間頑張ろうとしない
    body: |
      いきなり何時間も勉強や作業を続けようとしても、慣れていなければ大きな負担になります。脳のaMCC（前部中帯状皮質）と呼ばれる部分は、つらくても目標に向かって努力を続ける「粘り強さ」に関わっていると考えられています。

      そして、自制や努力を続ける力は、繰り返し練習することで伸ばせる可能性があります。

      資格勉強なら試験直前になって突然1日何時間も頑張るより、前もって「まずは15分」など短い時間から始めてみましょう。慣れてきたら30分、1時間と少しずつ増やしていく方が、長く続ける習慣を作りやすくなります。


  - id: 4
    required_rate: 700
    category: battle
    title: 【バトル】速さの変化
    body: |
      シュカモンには「速さ」のステータスがあり、速い方が先に攻撃できる。

      「速さ」はレベルが上がっても変わらないシュカモン固有のステータス。ただし、攻撃するたびに10ずつ減少するため、戦いが進めば先手と後手が入れ替わることもある。

      先手を取って相手を倒せば、弱点を突かなくても反撃は受けない。「速さ」をうまく温存して先手を取れる回数を増やせば、格上の相手に勝つこともできる。誰の「速さ」を温存するか、よく考えて立ち回ろう。


  - id: 5
    required_rate: 1000
    category: habit
    title: 意思の力は有限かもしれない
    body: |
      「意志の力は、使うほど減っていく燃料のようなもの」という説があります。長く集中したり強い自制を続けたりした後に自制が難しくなる現象が、研究でも確認されています。

      仕事や学校では、時間・場所・締め切りなどが外から決められています。そのため、「今やるかどうか」を自分だけで決める場面が減ります。一方、一人で行う勉強や運動は、先延ばしする選択も簡単にできます。だからこそ、自分の意志が必要なことは、疲れる前の元気な時間に先に置くのがおすすめです。

  - id: 6
    required_rate: 1500
    category: habit
    title: 集中のゾーン「フロー」に入るには？
    body: |
      フローとは、目の前の作業に深く入り込み、時間を忘れるほど集中している状態のことです。心理学者ミハイ・チクセントミハイの研究では、「自分の実力に合った難しさ」「何をすればよいか分かる目標」「うまく進んでいるか分かる反応」が、フローに入りやすい大切な条件とされています。

      簡単すぎる作業は退屈になり、難しすぎる作業は不安になりやすいため、「少し頑張ればできる」くらいに難しさを調整するのがポイントです。
