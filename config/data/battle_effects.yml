# ========================================================================
# エフェクト
# ========================================================================

# ヒットエフェクトと撃破エフェクトで共通利用する中空円の基本設定
ring_base:
  # 円の枠線の太さ。カード横幅に対する倍率（撃破エフェクトは戦闘エリアの横幅基準）
  border_width_ratio: 0.1

  # 円が出現した直後の不透明度。1.0で完全に不透明
  start_opacity_ratio: 0.7

  # 円の寿命が終了した時点の不透明度。0.0で完全に透明
  end_opacity_ratio: 0


# 攻撃が命中した時に表示するヒットエフェクト
hit_effect:
  # 攻撃したカードの属性に対応する中空円の色
  attribute_colors:
    # 月属性。白を基調に、ほんの少しだけ深緑を含んだ色
    mon:
      r: 226
      g: 235
      b: 229

    # 火属性。赤みを強く含んだオレンジ
    tue:
      r: 235
      g: 74
      b: 35

    # 水属性。暗い背景上で白くなりすぎない水色
    wed:
      r: 70
      g: 178
      b: 222

    # 木属性。黄緑と緑の中間
    thu:
      r: 105
      g: 190
      b: 72

    # 金属性。黄色に寄りすぎない金色
    fri:
      r: 218
      g: 166
      b: 38

    # 土属性。光のエフェクトとして視認できる明るさの土色
    sat:
      r: 171
      g: 105
      b: 55

    # 日属性。日の丸の色相を維持し、暗い背景上で潰れにくくした赤
    sun:
      r: 205
      g: 22
      b: 58

  # 攻撃を受けたカード上のランダムな位置に順番に発生させる小さい円
  random_rings:
    # 発生させる円の数
    count: 3

    # 出現時の直径。カード横幅に対する倍率
    initial_size_ratio: 0.3

    # 1つの円が拡大しながら透明になるまでの時間
    duration_ms: 500

    # 消えるまでに直径を何倍へ拡大するか
    scale_multiplier: 2

    # 小さい円が、1つ前の円の寿命がどの程度経過した時点で次の円を発生させるか
    next_spawn_at_ratio: 0.3

  # 攻撃を受けたカードの中央に発生させる大きい円
  center_ring:
    # random_ringsの出現時サイズに対する倍率
    initial_size_multiplier: 2

    # 円が拡大しながら透明になるまでの時間
    duration_ms: 800

    # 消えるまでに直径を何倍へ拡大するか
    scale_multiplier: 2.5

    # 大きい円が、1つ前の円の寿命がどの程度経過した時点で次の円を発生させるか
    next_spawn_at_ratio: 0.3


# カードが撃破された時に表示する白い中空円のエフェクト
# こちらは、大きさや発生位置などを戦闘エリアを基準に決めている。カード消失時でも生成できるようにするため。
defeat_effect:
  # 撃破エフェクトで使用する円の色
  color:
    r: 240
    g: 240
    b: 240

  # カード上のランダムな位置に繰り返し発生させる円
  rings:
    # 出現時の直径。カード横幅に対する倍率
    initial_size_ratio: 0.2

    # 1つの円が拡大しながら透明になるまでの時間
    duration_ms: 500

    # 消えるまでに直径を何倍へ拡大するか
    scale_multiplier: 2.2

    # 1つ前の円の寿命がどの程度経過した時点で次の円を発生させるか
    next_spawn_at_ratio: 0.3

  # 最終撃破ではない通常の撃破時に発生させる円の数
  normal_defeat:
    count: 8

  # 最終撃破時はリザルト画面の表示開始まで円を生成し続ける
  final_defeat:
    repeat_until_result: true

# ========================================================================
# カットイン
# ========================================================================

# --------属性有利・通常撃破・最終撃破で共通利用-------------------------

cut_in:
  # 【注意】モバイルビューの値はbattle_mobile.ymlで設定
  # カットインの背景として表示する細長い長方形の高さは◯rem
  rectangle_height_rem: 7

  # カットイン全体を傾ける角度は◯deg
  rotation_deg: 0

  # 長方形の中央点の配置位置は、画面上端から数えて◯
  # 画面全体の高さを1.0とした割合。
  vertical_center_ratio: 0.5

  # 撃破系カットインで表示するポートレートの高さは、長方形の高さに対して◯倍。
  #
  portrait_height_ratio: 1

  #
  # 文字とポートレートが、カットイン開始から終了までの間に右から左へ移動させる総距離は◯rem
  content_move_rem: 3

  # 長方形が変形し切るまでにかかる時間は◯ms。
  length_change_duration_ms: 200

  # 長方形が最大まで伸びた状態を維持する時間は◯ms
  max_length_hold_duration_ms: 1000

  # 長方形の長さは、画面の対角線の長さの◯倍
  length_overscan_ratio: 1

  # カットイン再生中に戦闘画面全体へ重ねる暗転用オーバーレイ
  overlay:
    # オーバーレイのRGB値（rgb全てにこの値を代入するため、一つだけ数字を入力）
    rgb: 5

    # 長方形が最大まで伸びた時点でのオーバーレイの不透明度。
    alpha: 0.3

  # カットイン内に表示する文字の共通設定
  text:
    # 【注意】モバイルビューの値はbattle_mobile.ymlで設定
    # カットイン内の文字サイズは◯rem
    font_size_rem: 4.0

    # カットイン内の文字のfont-weightは◯
    font_weight: 700

    # テキストの影のずれは◯px
    hadow_offset_x_px: 4
    shadow_offset_y_px: 4

    # テキストの影の不透明度は◯
    shadow_opacity_ratio: 0.7

    # ユーザー側のカードが属性有利で、相手の弱点をつく攻撃の直前に表示する文は◯
    user_advantage: 弱点をついた！！

    # エネミー側のカードが属性有利で、ユーザー側が弱点をつかれる攻撃の直前に表示する文は◯
    enemy_advantage: 弱点をつかれた！！

  # 長方形背景の上下方向グラデーション設定
  gradient:
    # 長方形のグラデーションが完了する位置の上からの割合は◯ （0.5以下）
    end_ratio: 0.15

  # ユーザー側が有利なカットインで使用する長方形の色
  user_advantage:
    # 長方形の上端・下端に使用する色（10進数）
    edge_color:
      r: 66

      g: 150

      b: 252

    # 長方形の中央部分に使用する色（10進数）
    center_color:
      r: 21

      g: 66

      b: 121

  # エネミー側が有利なカットインで使用する長方形の色
  # 属性有利・通常撃破・最終撃破で共通利用する。
  enemy_advantage:
    # 長方形の上端・下端に使用する色（10進数）
    edge_color:
      r: 252

      g: 66

      b: 0

    # 長方形の中央部分に使用する色（10進数）
    center_color:
      r: 131

      g: 40

      b: 8