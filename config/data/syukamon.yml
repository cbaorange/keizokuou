  exp_bonus_base: 5
  birthplace: 竹取物語

  first_get: |
    【nick】様も、新たな一歩を踏み出しましたのね？
    私も初めて地球を訪れたとき、同じ気持ちでしたわ。
    あなたの不安もワクワクも、全部知っていますのよ。

  repeat_get: |
    またお会いしましたわね。
    これも月のお導きでしょうか。

  normal_defeat: お仕置きですわ！
  final_defeat: 時は満ちましたわ
  win: |
    儚い方々でしたわ！
    美しく散る運命でしたのね。
  lose: |
    体が重い……！
    地球の重力のもとで戦うのは難しいですわ

  dialogues:
    - todo: |
        新天地での挑戦に、不安はつきものですわ。
        私も初めて地球に来た時は、同じ気持ちでしたの。
      done: |
        不慣れなことに取り組むときは、ポモドーロタイマーを短めに設定すると良いですわ。
        逆に、慣れた作業や好きな作業は、タイマーを長めに設定すると捗りますのよ。
        ……作業前に言うべきでしたわ。
      miss: |
        さようでございますか……
        そろそろ、月へ帰りますわね。

    - todo: |
        慣れぬ場所ほど、伸びしろがありますわ。
        【nick】様の旅路に、光あれ！
      done: |
        【nick】様、
        なんとも麗しい成果ですわね。
        明日も期待していますわ。
      miss: |
        さようでございますか……
        そろそろ、月へ帰りますわね。

