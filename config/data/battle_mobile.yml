battle_mobile:
  user_hand:
    # 手札カード同士の横方向の間隔。
    # ユーザーカード横幅に対する倍率
    card_gap_ratio: 0.1

    # ユーザー手札のカード下端と画面下端、
    # エネミー手札のカード上端と画面上端に共通して使用する余白。
    # ユーザーカード横幅に対する倍率
    vertical_edge_margin_ratio: 0.2

    # 左右の画面端と手札との余白。
    # ユーザーカード横幅に対する倍率
    edge_margin_ratio: 0.1

  hp:
    # HPバーの横幅を、対応カード横幅の何倍にするか
    # ユーザー・エネミー共通
    bar_width_ratio: 0.4

    # ユーザーHP数値の基準フォントサイズ
    # エネミー手札時はカード縮小倍率に合わせて縮小する
    user_text_font_size_rem: 0.9

  level:
    # レベル表示をカード左端から内側へ入れる横方向距離
    # ユーザーカード横幅に対する倍率
    offset_x_ratio: 0.1

    # レベル表示をカード上端から内側へ入れる縦方向距離
    # ユーザーカード横幅に対する倍率
    offset_y_ratio: 0.1

    # ユーザーレベル表示の基準フォントサイズ
    # エネミー手札時はカード縮小倍率に合わせて縮小する
    user_font_size_rem: 0.7

  battle_area:
    # 画面の水平中央線から、
    # エネミー戦闘エリアは上、ユーザー戦闘エリアは下へ
    # viewport高さの何倍だけ離すか
    center_offset_y_ratio: 0.16

  cut_in:
    # モバイルビューでのカットイン長方形の高さ
    rectangle_height_rem: 4

    text:
      # モバイルビューでのカットイン文字サイズ
      font_size_rem: 1.7
